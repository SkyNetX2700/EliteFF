kind = "web"
previewPath = "/"
title = "Elite FF"
version = "1.0.0"
id = "artifacts/elite-ff"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18633

[services.development]
run = "pnpm --filter @workspace/elite-ff run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elite-ff", "run", "build" ]
publicDir = "artifacts/elite-ff/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
